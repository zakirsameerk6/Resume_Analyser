services:
  # Option 1: FastAPI + React Single-Page Application
  - type: web
    name: resume-analyser-fullstack
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # Option 2: Streamlit Dashboard Web Service
  - type: web
    name: resume-analyser-streamlit
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
